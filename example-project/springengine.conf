# SpringEngine project config (.conf files are parsed as TOML 1.0)

[Engine]
config_schema = 1
project_id = "mygame"
project_title = "MyGame"
engine_api_version = "0.1"

[Paths]
scenes_dir = "./"
prefabs_dir = "./prefabs"
assets_dir = "./assets"
scripts_dir = "./scripts"
ui_dir = "./ui"

[Boot]
first_scene = "starting_scene.scene.conf"
autoload_data = "autoload.dat.conf"

[Window]
title = "MyGame"
width = 900
height = 600
target_fps = 60
resizable = true
clear_color = [30, 30, 45, 255]

[Runtime]
fixed_tick_hz = 60
max_frame_delta_seconds = 0.1
max_physics_steps_per_frame = 4
hot_reload_scripts = true

[Persistence]
# Actor ids that should exist for the full game lifetime.
# These are loaded once from autoload_data and never scene-unloaded.
autoload_actor_ids = [
	"global_audio",
	"input_router",
	"game_state",
]

[Streaming]
preload_next_scene_assets = true
unload_unused_assets_after_scene_switch = true

