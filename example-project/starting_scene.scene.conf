[Scene]
schema = 1
id = "starting_scene"
title = "Starting Scene"
data_file = "starting_scene.dat.conf"

[Scene.Lighting]
file = "starting_scene.lighting.conf"
schema = "OutdoorNight"
blend_in_seconds = 0.3

[Scene.Environment]
clear_color = [20, 24, 32, 255]
ambient_light = [0.18, 0.18, 0.22]

[Scene.Load]
# Ordered actor ids from the scene data file.
actors = [
	"starting_background",
	"main_camera",
	"sun_light",
	"player_spawn",
	"player_point_light",
	"crate_spawner",
	"mage_spawner",
	"fall_reset_trigger",
	"scene_fader",
	#"ground_tile_001",
	#"crate_001",
]

[Scene.UI]
documents = [
	"hud.ui.conf",
]

[Scene.Persistence]
# If true, actors with lifetime="scene" are unloaded when leaving this scene.
unload_scene_lifetime_actors_on_exit = true

[Scene.Transition]
next_scene = ""
transition_effect = "none"