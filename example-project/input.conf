[Input]
active_schema = "Normal"

[Schema.Normal]
MoveUp = { kind = "key_down", keys = ["w"] }
MoveDown = { kind = "key_down", keys = ["s"] }
MoveLeft = { kind = "key_down", keys = ["a"] }
MoveRight = { kind = "key_down", keys = ["d"] }
Run = { kind = "key_down", keys = ["left_shift"] }
Jump = { kind = "key_pressed", keys = ["space"] }

# Any listed binding can trigger this action.
# - chord: all keys in the list must be down on the same frame
# - key_pressed: key edge trigger
CloseGame = [
	{ kind = "chord", keys = ["left_control", "q"] },
	{ kind = "key_pressed", keys = ["escape"] },
]

[Schema.Menu]
MoveUp = { kind = "key_pressed", keys = ["up"] }
MoveDown = { kind = "key_pressed", keys = ["down"] }
Confirm = { kind = "key_pressed", keys = ["enter"] }
Back = { kind = "key_pressed", keys = ["escape"] }