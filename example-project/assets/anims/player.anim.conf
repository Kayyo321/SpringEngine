death_sheet="assets/Sprites/player/Pink_Monster/Pink_Monster_Death_8.png"

[Idle]
sheet="idle_sheet"
fps=8.0
loop=true
frames=[
    [0, 0, 32, 32],
    [32, 0, 32, 32],
    [64, 0, 32, 32],
    [96, 0, 32, 32],
]

[Idle.plug.Death]
condition="param_true"
param="dead"

[Idle.plug.Hurt]
condition="param_true"
