[Animation]
default="Idle"
flip_x_from_actor_movement=false
flip_x_deadzone=0.01
flip_x_when_param_negative=true

[Sheets]
idle_sheet="assets/Sprites/player/Pink_Monster/Pink_Monster_Idle_4.png"
walk_sheet="assets/Sprites/player/Pink_Monster/Pink_Monster_Walk_6.png"
jump_sheet="assets/Sprites/player/Pink_Monster/Pink_Monster_Jump_8.png"
run_sheet="assets/Sprites/player/Pink_Monster/Pink_Monster_Run_6.png"
