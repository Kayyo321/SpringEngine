[Animation]
default=Idle

[Sheets]
idle_sheet="assets/Sprites/player/Pink_Monster/Pink_Monster_Idle_4.png"
walk_sheet="assets/Sprites/player/Pink_Monster/Pink_Monster_Walk_6.png"

[Idle]
sheet=idle_sheet
fps=8.0
loop=true
frames=[
    [0, 0, 32, 32],
    [32, 0, 32, 32],
    [64, 0, 32, 32],
    [96, 0, 32, 32],
]

[Idle.plug.Walk]
condition="moving"
speed_threshold=0.05

[Walk]
sheet=walk_sheet
fps=12.0
loop=true
frames=[
    [0, 0, 32, 32],
    [32, 0, 32, 32],
    [64, 0, 32, 32],
    [96, 0, 32, 32],
    [128, 0, 32, 32],
    [160, 0, 32, 32],
]

[Walk.plug.Idle]
condition="not_moving"
speed_threshold=0.05
