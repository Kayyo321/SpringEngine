[Animation]
default="Idle"
flip_x_from_actor_movement=true
flip_x_deadzone=0.01
flip_x_when_param_negative=true

[Sheets]
idle_sheet="assets/Sprites/player/Pink_Monster/Pink_Monster_Idle_4.png"
walk_sheet="assets/Sprites/player/Pink_Monster/Pink_Monster_Walk_6.png"
jump_sheet="assets/Sprites/player/Pink_Monster/Pink_Monster_Jump_8.png"

[Idle]
sheet="idle_sheet"
fps=8.0
loop=true
frames=[
    [0, 0, 32, 32],
    [32, 0, 32, 32],
    [64, 0, 32, 32],
    [96, 0, 32, 32],
]

[Idle.plug.Walk]
condition="param_gt"
param="speed"
speed_threshold=0.05

[Idle.plug.Jump]
condition="param_lt"
param="grounded"
speed_threshold=0.5

[Walk]
sheet="walk_sheet"
fps=12.0
loop=true
frames=[
    [0, 0, 32, 32],
    [32, 0, 32, 32],
    [64, 0, 32, 32],
    [96, 0, 32, 32],
    [128, 0, 32, 32],
    [160, 0, 32, 32],
]

[Walk.plug.Idle]
condition="param_lt"
param="speed"
speed_threshold=0.05

[Walk.plug.Jump]
condition="param_lt"
param="grounded"
speed_threshold=0.5

[Jump]
sheet="jump_sheet"
fps=12.0
loop=true
frames=[
    [0, 0, 32, 32],
    [32, 0, 32, 32],
    [64, 0, 32, 32],
    [96, 0, 32, 32],
    [128, 0, 32, 32],
    [160, 0, 32, 32],
    [192, 0, 32, 32],
    [224, 0, 32, 32],
]

[Jump.plug.Idle]
condition="param_gt"
param="grounded"
speed_threshold=0.5
